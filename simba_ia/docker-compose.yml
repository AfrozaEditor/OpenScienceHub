services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: simba
      POSTGRES_PASSWORD: simba
      POSTGRES_DB: simba
    ports:
      - "5432:5432"
    volumes:
      - simba_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simba"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Extraction de métadonnées académiques (titre, auteurs, résumé, références).
  # Opt-in : `docker compose --profile grobid up -d`
  grobid:
    image: grobid/grobid:0.8.0
    profiles: ["grobid"]
    ports:
      - "8070:8070"

volumes:
  simba_pgdata:
