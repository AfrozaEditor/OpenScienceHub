[project]
name = "simba-ia"
version = "0.1.0"
description = "Microservice IA d'OpenScience Hub (extraction PDF + Assistant IA sourcé / RAG)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() en valeur par défaut

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
