services:
  backend_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: osh
      POSTGRES_PASSWORD: osh
      POSTGRES_DB: osh
    ports:
      - "5433:5432"
    volumes:
      - osh_backend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osh"]
      interval: 5s
      timeout: 5s
      retries: 20

  ids_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polyid_db
    ports:
      - "5434:5432"
    volumes:
      - osh_ids_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  ids:
    build:
      context: ./ids/eidStack-CMU
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./ids/eidStack-CMU/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      AGENT_PORT: 3021
      API_BASE_URL: http://localhost:4000
      AGENT_PUBLIC_URL: http://localhost:3021
      DATABASE_URL: postgresql://postgres:postgres@ids_postgres:5432/polyid_db?schema=public
      BCOVRIN_TESTNET_URL: http://test.bcovrin.vonx.io/register
      INDY_NETWORK_NAMESPACE: bcovrin:test
      ISSUER_LABEL: OpenScienceHub_Issuer_Local
      VERIFIER_LABEL: OpenScienceHub_Verifier_Local
      CREDENTIAL_PROTOCOL_VERSION: v2
    ports:
      - "4000:4000"
      - "3021:3021"
    depends_on:
      ids_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/docs-yaml').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SECRET_KEY: dev-openscience-hub-local-secret-key-change-in-prod
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,testserver,backend
      DATABASE_URL: postgresql://osh:osh@backend_db:5432/osh
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
      SIMBA_IA_URL: http://simba_ia:8001
      SIMBA_API_KEY: dev-simba-key
      SIMBA_MODE: live
      EIDSTACK_BASE_URL: http://ids:4000
      EIDSTACK_API_KEY: dev-eidstack-key
      EIDSTACK_ENVIRONMENT: TEST
      EIDSTACK_CREDENTIAL_DEFINITION_ID: ""
      EIDSTACK_CONNECTION_ID: ""
      SSI_MODE: live
      PUBLIC_VERIFY_BASE_URL: http://localhost:8000/api/v1/verify
      DJANGO_SUPERUSER_EMAIL: admin@openscience.local
      DJANGO_SUPERUSER_PASSWORD: adminpass
    ports:
      - "8000:8000"
    volumes:
      - osh_backend_media:/app/media
    depends_on:
      backend_db:
        condition: service_healthy
      ids:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/schema/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  osh_backend_pgdata:
  osh_ids_pgdata:
  osh_backend_media:
