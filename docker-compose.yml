services:
  backend_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: osh
      POSTGRES_PASSWORD: osh
      POSTGRES_DB: osh
    ports:
      - "5433:5432"
    volumes:
      - osh_backend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osh"]
      interval: 5s
      timeout: 5s
      retries: 20

  simba_db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: simba
      POSTGRES_PASSWORD: simba
      POSTGRES_DB: simba
    ports:
      - "5435:5432"
    volumes:
      - osh_simba_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simba"]
      interval: 5s
      timeout: 5s
      retries: 20

  ids_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polyid_db
    ports:
      - "5434:5432"
    volumes:
      - osh_ids_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  simba_ia:
    build:
      context: ./simba_ia
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./simba_ia/.env
    environment:
      SIMBA_MODE: live
      SIMBA_API_KEY: dev-simba-key
      DATABASE_URL: postgresql+psycopg://simba:simba@simba_db:5432/simba
      DB_SCHEMA: simba
    ports:
      - "8001:8001"
    volumes:
      - ./simba_ia:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    depends_on:
      simba_db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8001/health', timeout=5)); raise SystemExit(0 if data.get('status') == 'ok' else 1)\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  ids:
    build:
      context: ./ids/eidStack-CMU
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      AGENT_PORT: 3021
      API_BASE_URL: http://localhost:4000
      AGENT_PUBLIC_URL: http://localhost:3021
      CREDO_ALLOW_INSECURE_HTTP: "true"
      OPENSCIENCE_DISABLE_DIDCOMM: "true"
      DATABASE_URL: postgresql://postgres:postgres@ids_db:5432/polyid_db?schema=public
      BCOVRIN_TESTNET_URL: https://test.bcovrin.vonx.io/register
      INDY_NETWORK_NAMESPACE: bcovrin:test
      ISSUER_LABEL: OpenScienceHub_Issuer_Local
      VERIFIER_LABEL: OpenScienceHub_Verifier_Local
      CREDENTIAL_PROTOCOL_VERSION: v2
    ports:
      - "${IDS_API_PORT:-4001}:4000"
      - "3021:3021"
    depends_on:
      ids_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/docs-yaml').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: dev-openscience-hub-local-secret-key-change-in-prod
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgresql://osh:osh@backend_db:5432/osh
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,testserver,backend,*
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://${LAN_HOST_IP:-localhost}:3000
      CORS_ALLOWED_ORIGIN_REGEXES: ^http://([0-9]{1,3}\.){3}[0-9]{1,3}:3000$
      SIMBA_MODE: live
      SIMBA_IA_URL: http://simba_ia:8001
      SIMBA_API_KEY: dev-simba-key
      BACKEND_PUBLIC_BASE_URL: http://backend:8000
      SSI_MODE: live
      EIDSTACK_BASE_URL: http://ids:4000
      EIDSTACK_API_KEY: dev-eidstack-key
      EIDSTACK_ENVIRONMENT: TEST
      EIDSTACK_CREDENTIAL_DEFINITION_ID: ""
      EIDSTACK_CONNECTION_ID: ""
      EIDSTACK_WALLET_ID: openscience-hub-issuer-local
      EIDSTACK_WALLET_KEY: openscience-hub-wallet-key
      EIDSTACK_AGENT_ENDPOINT: http://localhost:3021
      EIDSTACK_AGENT_LABEL: OpenScienceHub IDS Local
      EIDSTACK_AGENT_SEED: "00000000000000000000000000000001"
      PUBLIC_VERIFY_BASE_URL: ${PUBLIC_VERIFY_BASE_URL:-http://${LAN_HOST_IP:-localhost}:3000/verify}
      DJANGO_SUPERUSER_EMAIL: admin@openscience.local
      DJANGO_SUPERUSER_PASSWORD: adminpass
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - osh_backend_media:/app/media
    entrypoint: []
    command:
      - bash
      - -lc
      - python manage.py migrate --noinput && (python manage.py collectstatic --noinput || true) && (python manage.py shell -c "import os; from django.contrib.auth import get_user_model; U = get_user_model(); email = os.environ.get('DJANGO_SUPERUSER_EMAIL'); password = os.environ.get('DJANGO_SUPERUSER_PASSWORD'); U.objects.filter(email=email).exists() or U.objects.create_superuser(email=email, password=password, full_name='Administrateur')" || true) && exec python manage.py runserver 0.0.0.0:8000
    depends_on:
      backend_db:
        condition: service_healthy
      simba_ia:
        condition: service_healthy
      ids:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/schema/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        NEXT_PUBLIC_FRONTEND_VERIFY_BASE_URL: ${NEXT_PUBLIC_FRONTEND_VERIFY_BASE_URL:-http://${LAN_HOST_IP:-localhost}:3000/verify}
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      BACKEND_INTERNAL_API_BASE_URL: http://backend:8000/api/v1
      BACKEND_INTERNAL_MEDIA_BASE_URL: http://backend:8000/media
      NEXT_PUBLIC_FRONTEND_VERIFY_BASE_URL: ${NEXT_PUBLIC_FRONTEND_VERIFY_BASE_URL:-http://${LAN_HOST_IP:-localhost}:3000/verify}
      LAN_HOST_IP: ${LAN_HOST_IP:-localhost}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - osh_frontend_node_modules:/app/node_modules
      - osh_frontend_next:/app/.next
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  osh_backend_pgdata:
  osh_backend_media:
  osh_simba_pgdata:
  osh_ids_pgdata:
  osh_frontend_node_modules:
  osh_frontend_next:
