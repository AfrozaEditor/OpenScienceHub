              - button "Quels types de documents puis-je déposer ?" [ref=e88]:
                - img [ref=e90]
                - generic [ref=e93]: Quels types de documents puis-je déposer ?
                - img [ref=e95]
              - paragraph [ref=e98]: Mémoires, thèses, articles scientifiques, rapports de recherche et actes de conférence sont acceptés. Le dépôt se fait au format PDF afin de garantir l'intégrité et la lisibilité du document sur le long terme.
            - generic [ref=e99]:
              - button "Comment déposer un document ?" [ref=e100]:
                - img [ref=e102]
                - generic [ref=e105]: Comment déposer un document ?
                - img [ref=e107]
              - generic [ref=e109]:
                - paragraph [ref=e110]: Rendez-vous sur l'espace Déposant, glissez-déposez votre PDF, laissez l'IA pré-remplir les métadonnées, vérifiez-les puis validez la soumission. Le suivi de votre dépôt apparaît ensuite dans « Mes dossiers ».
                - link "Déposer un document" [ref=e111] [cursor=pointer]:
                  - /url: /deposant/deposer
                  - text: Déposer un document
                  - img [ref=e112]
            - generic [ref=e114]:
              - button "Quelle est la taille maximale d'un fichier ?" [ref=e115]:
                - img [ref=e117]
                - generic [ref=e120]: Quelle est la taille maximale d'un fichier ?
                - img [ref=e122]
              - paragraph [ref=e125]: Un document peut atteindre 50 Mo. Pour les travaux volumineux (annexes, jeux de données), privilégiez un PDF principal et référencez les ressources complémentaires dans les métadonnées.
            - generic [ref=e126]:
              - button "Comment l'IA extrait-elle les métadonnées ?" [ref=e127]:
                - img [ref=e129]
                - generic [ref=e132]: Comment l'IA extrait-elle les métadonnées ?
                - img [ref=e134]
              - generic [ref=e136]:
                - paragraph [ref=e137]: Après l'ajout du PDF, le document est analysé pour détecter automatiquement le titre, les auteurs, le résumé, les mots-clés, l'année, la filière et le domaine scientifique. Vous gardez la main pour corriger chaque champ avant la soumission.
                - link "Essayer le dépôt assisté" [ref=e138] [cursor=pointer]:
                  - /url: /deposant/deposer
                  - text: Essayer le dépôt assisté
                  - img [ref=e139]
            - generic [ref=e141]:
              - button "Puis-je corriger les métadonnées proposées par l'IA ?" [ref=e142]:
                - img [ref=e144]
                - generic [ref=e147]: Puis-je corriger les métadonnées proposées par l'IA ?
                - img [ref=e149]
              - paragraph [ref=e152]: Oui. Une étape de révision vous permet d'éditer chaque champ. Les corrections que vous apportez améliorent la qualité documentaire et facilitent la recherche à facettes pour les autres utilisateurs.
            - generic [ref=e153]:
              - button "L'indice de confiance de l'IA, qu'est-ce que c'est ?" [ref=e154]:
                - img [ref=e156]
                - generic [ref=e159]: L'indice de confiance de l'IA, qu'est-ce que c'est ?
                - img [ref=e161]
              - paragraph [ref=e164]: C'est une estimation de la fiabilité de l'extraction automatique. Un indice élevé signifie que les champs proposés sont probablement exacts ; un indice plus faible vous invite à vérifier attentivement avant validation.
            - generic [ref=e165]:
              - button "Combien de temps prend la validation institutionnelle ?" [ref=e166]:
                - img [ref=e168]
                - generic [ref=e171]: Combien de temps prend la validation institutionnelle ?
                - img [ref=e173]
              - paragraph [ref=e176]: "Le département vérifie les métadonnées sous quelques jours ouvrés en général. Vous êtes notifié à chaque changement de statut : En attente, Validé ou Rejeté."
            - generic [ref=e177]:
              - button "Que se passe-t-il si mon dépôt est rejeté ?" [ref=e178]:
                - img [ref=e180]
                - generic [ref=e183]: Que se passe-t-il si mon dépôt est rejeté ?
                - img [ref=e185]
              - generic [ref=e187]:
                - paragraph [ref=e188]: Un motif de rejet vous est communiqué dans le détail du dossier. Vous pouvez corriger les éléments signalés puis resoumettre le document sans repartir de zéro.
                - link "Voir mes dossiers" [ref=e189] [cursor=pointer]:
                  - /url: /deposant/mes-dossiers
                  - text: Voir mes dossiers
                  - img [ref=e190]
            - generic [ref=e192]:
              - button "Qu'est-ce qu'une preuve d'authenticité ?" [ref=e193]:
                - img [ref=e195]
                - generic [ref=e198]: Qu'est-ce qu'une preuve d'authenticité ?
                - img [ref=e200]
              - generic [ref=e202]:
                - paragraph [ref=e203]: Chaque document validé reçoit une empreinte cryptographique SHA-256 et une attestation vérifiable. Cette preuve garantit l'intégrité du fichier et l'origine du dépôt, et reste vérifiable de façon indépendante.
                - link "Voir un exemple de preuve" [ref=e204] [cursor=pointer]:
                  - /url: /deposant/preuve/1
                  - text: Voir un exemple de preuve
                  - img [ref=e205]
            - generic [ref=e207]:
              - button "Comment vérifier l'authenticité d'un document ?" [ref=e208]:
                - img [ref=e210]
                - generic [ref=e213]: Comment vérifier l'authenticité d'un document ?
                - img [ref=e215]
              - paragraph [ref=e218]: Depuis la page « Preuve » du dossier, comparez l'empreinte SHA-256, scannez le QR code ou consultez le registre. Toute modification du fichier change l'empreinte, ce qui rend la falsification immédiatement détectable.
            - generic [ref=e219]:
              - button "Dois-je créer un compte pour consulter les travaux ?" [ref=e220]:
                - img [ref=e222]
                - generic [ref=e225]: Dois-je créer un compte pour consulter les travaux ?
                - img [ref=e227]
              - paragraph [ref=e230]: Non. La consultation et le téléchargement des travaux publiés sont en accès libre. Un compte est requis uniquement pour déposer des documents et suivre vos dossiers.
            - generic [ref=e231]:
              - button "Comment créer un compte déposant ?" [ref=e232]:
                - img [ref=e234]
                - generic [ref=e237]: Comment créer un compte déposant ?
                - img [ref=e239]
              - generic [ref=e241]:
                - paragraph [ref=e242]: Cliquez sur « Créer un compte », renseignez votre identité, votre rôle et votre faculté de rattachement, puis activez votre accès. Vous pourrez ensuite déposer et gérer vos travaux depuis votre tableau de bord.
                - link "Créer un compte" [ref=e243] [cursor=pointer]:
                  - /url: /signup
                  - text: Créer un compte
                  - img [ref=e244]
