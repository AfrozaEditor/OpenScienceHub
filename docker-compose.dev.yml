services:
  backend:
    volumes:
      - ./backend:/app
      - osh_backend_media:/app/media
    entrypoint: ["/bin/sh", "-lc"]
    command: "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

  simba_ia:
    build:
      context: ./simba_ia
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./simba_ia:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  ids:
    build:
      context: ./ids/eidStack-CMU
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./ids/eidStack-CMU:/usr/src/app
      - osh_ids_node_modules:/usr/src/app/node_modules
    user: root
    command: >
      sh -lc "npx prisma generate &&
              npx prisma migrate deploy &&
              npm run start:dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    volumes:
      - ./frontend:/app
      - osh_frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      BACKEND_INTERNAL_API_BASE_URL: http://backend:8000/api/v1
      BACKEND_INTERNAL_MEDIA_BASE_URL: http://backend:8000/media
      NEXT_PUBLIC_FRONTEND_VERIFY_BASE_URL: ${NEXT_PUBLIC_FRONTEND_VERIFY_BASE_URL:-http://${LAN_HOST_IP:-localhost}:3000/verify}
      LAN_HOST_IP: ${LAN_HOST_IP:-localhost}

volumes:
  osh_backend_media:
  osh_ids_node_modules:
  osh_frontend_node_modules:
